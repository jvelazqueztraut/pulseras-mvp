name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm ci

      - name: Build debug APK
        run: npm run build:apk -- --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pulseras-debug
          path: dist/Pulseras-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(dist/Pulseras-*-debug.apk)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK in dist/, found ${#apks[@]}"
            exit 1
          fi
          cp "${apks[0]}" dist/Pulseras-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest dist/Pulseras-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Latest debug APK" \
            --notes "Unsigned debug APK from ${GITHUB_SHA:0:7} on main. Sideload for testing; this is not a Play-signed release. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --latest
